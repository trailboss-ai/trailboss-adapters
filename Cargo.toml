[package]
name = "trailboss-adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Trailboss's adapters: reading coding agents' session transcripts, and listing, reading and typing into terminal apps"
license = "MIT"
repository = "https://github.com/trailboss-ai/trailboss-adapters"
# Used by the trailboss CLI as a git dependency; not on crates.io (yet).
publish = false

[dependencies]
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
